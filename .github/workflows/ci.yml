name: ci

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : ce job ne fait que lire le code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tout l'historique, pour que gitleaks le scanne

      - name: Hooks pre-commit (ruff, yaml…)
        run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks  # le hook ne voit que le staged ; on scanne l'historique ci-dessous

      - name: Secrets dans tout l'historique
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact -v
